ROUNDS.rk={
  start(){G.q={qs:queue(draw('rk',G.cfg.rk*2)),i:0}},
  init(it){it.ph='rank';it.o=[null,null]},
  act(p,a,it){
    if(a.t==='rk_lock'&&it.ph==='rank'&&it.o[p]==null){it.o[p]=a.v;ev('lock',{p});
      if(it.o[0]&&it.o[1]){it.ph='rev';const s=it.s,g=1-s,act_=it.o[s],gu=it.o[g],n=act_.length;let tot=0;
        act_.forEach((t,k)=>{const off=Math.abs(gu.indexOf(t)-k),p2=off===0?60:off===1?20:0;tot+=p2;if(p2)award(g,p2,{at:1300+k*900+350})});
        if(act_.every((t,k)=>gu[k]===t))award(g,100,{at:1300+n*900+500,big:'Perfect match!'});else if(!tot)award(g,0,{at:1300+n*900+500,miss:1,aww:1})}}
  },
  view(it){
    const s=it.s,g=1-s,items=it.p[1],n=items.length,head=`<h2 class="q">Rank these <span class="hl">${esc(it.p[0])}</span> from ${tag(s)}'s favorite to least favorite</h2>${meta('Up to '+(n*60+100))}`,st=statusOf(it.o,'✓ locked','ranking…');
    if(it.ph==='rank'){
      if(it.o[ME])return{key:Q()+'|wait',status:st,html:card(`${head}${waitBox('🔒','Locked in',`Waiting for ${N(OTHER())}`)}`,1)};
      return{key:Q()+'|rank',status:st,html:card(`${head}<div class="who-tag center-row">${ME===s?'Your real order':`Your guess at ${N(s)}'s order`}</div>${rkBoard(shuffle(items))}
        <div class="row"><button class="btn" id="lock">${ME===s?'Lock in my order':'Lock in my guess'} 🔒</button></div>`,1),
        mount(){const get=rkDrag($('#rk'));$('#lock').onclick=()=>{SFX.lock();act({t:'rk_lock',v:get()})}}};
    }
    const anim=once(Q()+'|rev'),emo=new Map(items.map(([e,t])=>[t,e])),A=it.o[s],GU=it.o[g];
    const tile=(t,k,cls,id,extra='')=>`<div class="rr ${cls}" id="${id}"><span class="rr-n">${k+1}</span><span class="rk-emo">${emo.get(t)}</span><span class="rr-t">${esc(t)}</span>${extra}</div>`;
    return{key:Q()+'|rev',ready:'Next',readyAt:anim?1300+n*900+700:0,html:card(`${head}
      <div class="rr-wrap"><div class="rr-h c${s}">${N(s)}'s real order</div><div></div><div class="rr-h c${g}">${N(g)}'s guess</div>
        <div class="rr-body" id="rrb"><div class="rr-col">${A.map((t,k)=>`<div class="rr-flip" id="ra${k}"><div class="rr-in"><div class="rr hidden"><span class="rr-n">${k+1}</span><span class="rr-t">?</span></div>${tile(t,k,'back','rab'+k)}</div></div>`).join('')}</div>
          <div></div><div class="rr-col">${GU.map((t,k)=>tile(t,k,'','rg'+k,'<span class="chip"></span>')).join('')}</div><svg class="rr-svg" id="rrsvg"></svg></div></div>
      <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
      mount(){const lines=[];
        const drawL=()=>{const b=$('#rrb'),svg=$('#rrsvg');if(!b)return;const br=b.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${br.width} ${br.height}`);
          svg.innerHTML=lines.map(([k,j,c,an])=>{const a=$('#ra'+k).getBoundingClientRect(),q=$('#rg'+j).getBoundingClientRect();
            const x1=a.right-br.left,y1=a.top+a.height/2-br.top,x2=q.left-br.left,y2=q.top+q.height/2-br.top,mx=(x2-x1)/2;
            return `<path d="M${x1} ${y1} C${x1+mx} ${y1},${x2-mx} ${y2},${x2} ${y2}" stroke="${c}" class="${an?'grow':''}" pathLength="1"/><circle cx="${x1}" cy="${y1}" r="5" fill="${c}"/><circle cx="${x2}" cy="${y2}" r="5" fill="${c}"/>`}).join('');lines.forEach(l=>l[3]=false)};
        window._redraw=drawL;if(window.ResizeObserver)new ResizeObserver(()=>drawL()).observe($('#rrb'));
        if(anim)SFX.drum();let tot=0;
        A.forEach((t,k)=>setTimeout(()=>{const j=GU.indexOf(t),off=Math.abs(j-k),p=off===0?60:off===1?20:0,cls=off===0?'hit':off===1?'near':'miss',c=off===0?'#2ee59d':off===1?'#ffd23f':'#ff4d4d';
          $('#ra'+k)?.classList.add('show');$('#rab'+k)?.classList.add(cls);
          setTimeout(()=>{lines.push([k,j,c,anim]);const gt=$('#rg'+j);if(!gt)return;gt.classList.add(cls);gt.querySelector('.chip').textContent=p?`+${p}`:`${off} off`;tot+=p;requestAnimationFrame(drawL);
            if(anim){if(p===60)SFX.ding();else if(p)SFX.reveal();else SFX.wrong()}},anim?350:0)},anim?1300+k*900:0));
        setTimeout(()=>{const perfect=A.every((t,k)=>GU[k]===t);const v=$('#verdict');if(!v)return;tot+=perfect?100:0;
          v.innerHTML=`<div class="big ${perfect?'goldc':tot>=n*18?'good':'badc'}">${perfect?'Perfect match!':tot>=n*36?'Mind reader!':tot>=n*18?'Pretty close!':tot?'Some work to do':'Total mismatch!'}</div><div class="lead">${tag(g)} earns <b>${tot}</b>.</div>`},anim?1300+n*900+500:60)}};
  }
};

/* ---------- 5. Same Page (simultaneous) ---------- */
ROUNDS.sp={
  start(){const n=G.cfg.sp,nm=Math.ceil(n/2);const ml=draw('ml',nm).map(p=>({type:'ml',p})),w=draw('wyr',n-nm).map(p=>({type:'wyr',p}));
    const qs=[];while(ml.length||w.length){if(ml.length)qs.push(ml.shift());if(w.length)qs.push(w.shift())}qs.forEach((q,j)=>q.s=j%2);G.q={qs,i:0}},
  init(it){it.ph='ans';it.ans=[null,null];it.pred=[null,null]},
  act(p,a,it){
    if(a.t==='sp_lock'&&it.ph==='ans'&&it.ans[p]==null){it.ans[p]=a.ans;it.pred[p]=a.pred;ev('lock',{p});
      if(it.ans[0]!=null&&it.ans[1]!=null){it.ph='rev';
        if(it.type==='ml'){if(it.ans[0]===it.ans[1]){award(0,100,{at:2600,big:'Same page!'});award(1,100,{at:2600})}else{award(0,0,{at:2600,miss:1,aww:1});award(1,0,{at:2600,miss:1})}}
        else[0,1].forEach(i=>{const ok=it.pred[i]===it.ans[1-i];if(ok)award(i,100,{at:2100+i*900});else award(i,0,{at:2100+i*900,miss:1})})}}
  },
  view(it){
    const head=`<h2 class="q">${it.type==='ml'?`Who's more likely to ${esc(it.p)}?`:'Would you rather...'}</h2>${meta(it.type==='ml'?"Who's more likely":'Would you rather','alt')}`,st=statusOf(it.ans);
    if(it.ph==='ans'){
      if(it.ans[ME]!=null)return{key:Q()+'|wait',status:st,html:card(`${head}${waitBox('🔒','Locked in',`Waiting for ${N(OTHER())}`)}`,1)};
      const o=OTHER();
      const body=it.type==='ml'?`<div class="sublabel">Who's more likely?</div><div class="choice" data-g="ans"><button class="ch-btn big n0" data-v="0">${N(0)}</button><button class="ch-btn big n1" data-v="1">${N(1)}</button></div>`
        :`<div class="sublabel">Your pick</div><div class="choice" data-g="ans"><button class="ch-btn" data-v="0">${esc(it.p[0])}</button><button class="ch-btn" data-v="1">${esc(it.p[1])}</button></div>
          <div class="sublabel">What will ${tag(o)} pick?</div><div class="choice" data-g="pred"><button class="ch-btn" data-v="0">${esc(it.p[0])}</button><button class="ch-btn" data-v="1">${esc(it.p[1])}</button></div>`;
      return{key:Q()+'|ans',status:st,html:card(`${head}${body}<div class="row"><button class="btn" id="lock">Lock it in 🔒</button></div>`,1),
        mount(){stage.querySelectorAll('.choice').forEach(gp=>gp.querySelectorAll('.ch-btn').forEach(b=>b.onclick=()=>{gp.querySelectorAll('.ch-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');SFX.pop();sparkleAt(b,10)}));
          $('#lock').onclick=()=>{const gs=[...stage.querySelectorAll('.choice')],miss=gs.filter(x=>!x.querySelector('.sel'));if(miss.length){miss.forEach(shakeEl);return}
            const val=g=>{const x=stage.querySelector(`.choice[data-g="${g}"] .sel`);return x?+x.dataset.v:null};SFX.lock();act({t:'sp_lock',ans:val('ans'),pred:val('pred')})}}};
    }
    const anim=once(Q()+'|rev');
    if(it.type==='ml'){const same=it.ans[0]===it.ans[1];
      return{key:Q()+'|rev',ready:'Next',readyAt:anim?2800:0,html:card(`${head}<div class="sp-res">${[0,1].map(i=>`<div class="sp-card v${i} ${anim?'':'in'}" id="sc${i}"><div class="spk">${N(i)} said</div><div class="spv big c${it.ans[i]}">${N(it.ans[i])}</div></div>`).join('')}</div>
        <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
        mount(){if(anim){SFX.drum();setTimeout(()=>{$('#sc0')?.classList.add('in');SFX.reveal()},1200);setTimeout(()=>{$('#sc1')?.classList.add('in');SFX.reveal()},1900)}
          setTimeout(()=>{const v=$('#verdict');if(v)v.innerHTML=same?`<div class="big good">Same page!</div><div class="lead">You both picked ${tag(it.ans[0])}. +100 each.</div>`:`<div class="big badc">Not on the same page</div><div class="lead">Discuss.</div>`},anim?2600:0)}};
    }
    const opt=v=>esc(it.p[v]);
    return{key:Q()+'|rev',ready:'Next',readyAt:anim?3800:0,html:card(`${head}<div class="sp-res">${[0,1].map(i=>{const o=1-i,ok=it.pred[i]===it.ans[o];
        return `<div class="sp-card v${i} ${anim?'':'in'}" id="sc${i}"><div class="spk c${i}">${N(i)} picked</div><div class="spv">${opt(it.ans[i])}</div>
          <div class="spk">and predicted ${N(o)} would pick</div><div class="spv pred ${ok?'good':'badc'} ${anim?'':'in'}" id="pr${i}">${opt(it.pred[i])} ${ok?'✓':'✕'}</div></div>`}).join('')}</div>
      <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
      mount(){if(anim){SFX.drum();setTimeout(()=>{$('#sc0')?.classList.add('in');$('#sc1')?.classList.add('in');SFX.reveal()},1200);
          [0,1].forEach(i=>setTimeout(()=>{$('#pr'+i)?.classList.add('in');it.pred[i]===it.ans[1-i]?SFX.right():SFX.wrong()},2100+i*900))}
        setTimeout(()=>{const r=[0,1].map(i=>it.pred[i]===it.ans[1-i]),v=$('#verdict');if(!v)return;if(r[0]&&r[1]&&anim){hype('Mind meld!');SFX.applause()}
          v.innerHTML=r[0]&&r[1]?`<div class="big good">You read each other perfectly!</div>`:r[0]||r[1]?`<div class="big goldc">${tag(r[0]?0:1)} called it!</div>`:`<div class="big badc">Nobody saw that coming</div>`},anim?3800:0)}};
  }
};

/* ---------- 6. Fib Detector ---------- */
ROUNDS.fib={
  start(){G.q={qs:queue(draw('fib',G.cfg.fib*2)),i:0}},
  init(it){it.ph='write';it.cards=null;it.pick=null},
  act(p,a,it){const s=it.s,g=1-s;
    if(a.t==='fib_write'&&p===s&&it.ph==='write'){it.cards=shuffle(a.v.slice(0,3).map((t,k)=>({t:String(t).slice(0,80),real:k===0})));it.ph='guess';ev('lock',{p})}
    if(a.t==='fib_pick'&&p===g&&it.ph==='guess'){it.pick=Math.max(0,Math.min(2,+a.k));it.ph='rev';const at=1300+3*900+400;
      if(it.cards[it.pick].real){award(g,200,{at,big:'Lie detector!'});award(s,0,{at,miss:1})}else{award(s,150,{at,bad:'Fooled you!'});award(g,0,{at,miss:1})}}
  },
  view(it){
    const s=it.s,g=1-s,head=`<h2 class="q">${fill(it.p,s)}</h2>${meta('Truth +200 · Fool +150')}`;
    if(it.ph==='write'){
      if(ME===g)return{key:Q()+'|write|g',html:card(`${head}${waitBox('🕵️',`${N(s)} is cooking up two fibs`,'One answer will be true. Get your lie detector ready.')}`,1)};
      return{key:Q()+'|write|s',html:card(`${head}<p class="lead center">Write the real answer, then two fibs that sound just as believable.</p>
        <div class="fibin"><label><span class="tg t">Truth</span><input type="text" class="fi" maxlength="80" autocomplete="off" placeholder="The real answer"></label>
          <label><span class="tg f">Fib #1</span><input type="text" class="fi" maxlength="80" autocomplete="off" placeholder="A believable lie"></label>
          <label><span class="tg f">Fib #2</span><input type="text" class="fi" maxlength="80" autocomplete="off" placeholder="Another one"></label></div>
        <div class="hint">Capitalization gets matched automatically so nothing gives it away.</div>
        <div class="row"><button class="btn" id="lock">Lock them in 🔒</button></div>`,1),
        mount(){const ins=[...stage.querySelectorAll('.fi')];
          const go=()=>{const v=ins.map(x=>sentenceCase(x.value));const e=ins.filter((x,k)=>!v[k]);if(e.length){e.forEach(shakeEl);return}
            if(new Set(v.map(x=>x.toLowerCase())).size<3){ins.forEach(shakeEl);toast('All three need to be different');return}SFX.lock();act({t:'fib_write',v})};
          ins.forEach((x,k)=>x.onkeydown=e=>{if(e.key==='Enter'){if(k<2)ins[k+1].focus();else go()}});$('#lock').onclick=go}};
    }
    if(it.ph==='guess'){
      if(ME===s){const r=it.cards.findIndex(c=>c.real);return{key:Q()+'|guess|s',html:card(`${head}${waitBox('🤞',`${N(g)} is deciding`)}<div class="mine-note">Your truth is option <b>${'ABC'[r]}</b>. Keep a straight face.</div>
        <div class="fibs" style="margin-top:12px">${it.cards.map((c,k)=>`<div class="fibcard ${c.real?'sel':''}" style="--c:var(--ok)"><span class="ltr">${'ABC'[k]}</span><span>${esc(c.t)}</span></div>`).join('')}</div>`,1)}}
      return{key:Q()+'|guess|g',html:card(`${head}<p class="lead center">One of these is true. Which one?</p>
        <div class="fibs">${it.cards.map((c,k)=>`<button class="fibcard" data-k="${k}" style="--c:var(--p${g})"><span class="ltr">${'ABC'[k]}</span><span>${esc(c.t)}</span><span class="stamp"></span></button>`).join('')}</div>
        <div class="row"><button class="btn" id="lock">That's the truth</button></div>`,1),
        mount(){let pk=null;stage.querySelectorAll('.fibcard').forEach(b=>b.onclick=()=>{pk=+b.dataset.k;stage.querySelectorAll('.fibcard').forEach(x=>x.classList.toggle('sel',x===b));SFX.pop()});
          $('#lock').onclick=()=>{if(pk==null){shakeEl($('.fibs'));return}SFX.lock();act({t:'fib_pick',k:pk})}}};
    }
    const anim=once(Q()+'|rev'),right=it.cards[it.pick].real;
    return{key:Q()+'|rev',ready:'Next',readyAt:anim?1300+3*900+600:0,html:card(`${head}
      <div class="fibs">${it.cards.map((c,k)=>`<div class="fibcard ${k===it.pick?'sel':''}" id="fc${k}" style="--c:var(--p${g})"><span class="ltr">${'ABC'[k]}</span><span>${esc(c.t)}</span><span class="stamp">${c.real?'TRUTH':'FIB'}</span></div>`).join('')}</div>
      <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
      mount(){if(anim)SFX.drum();const order=it.cards.map((c,k)=>k).sort((a,b)=>it.cards[a].real-it.cards[b].real);
        order.forEach((k,n)=>setTimeout(()=>{const c=it.cards[k],el=$('#fc'+k);if(!el)return;el.classList.add(c.real?'istruth':'isfib');if(anim){if(c.real){SFX.cymbal();sparkleAt(el,40,['#2ee59d','#fff'])}else SFX.strike()}},anim?1300+n*900:0));
        setTimeout(()=>{const v=$('#verdict');if(v)v.innerHTML=right?`<div class="big good">${N(g)} sniffed it out!</div><div class="lead">${tag(g)} gets +200.</div>`:`<div class="big badc">${N(s)} got away with it!</div><div class="lead">${tag(s)} gets +150 for the con.</div>`},anim?1300+3*900+400:0)}};
  }
};

/* ---------- 7. The Draft ---------- */
ROUNDS.dr={
  start(){G.q={qs:draw('dr',G.cfg.dr).map((p,j)=>({p,s:j%2,first:j%2})),i:0}},
  init(it){it.partner=it.p[1]==='PARTNER';it.picks=[];it.owner={};it.rank=[null,null];it.grid=shuffle(it.p[2]);it.ph=it.partner?'rank':'board'},
  act(p,a,it){
    if(a.t==='dr_rank'&&it.ph==='rank'&&it.rank[p]==null){it.rank[p]=a.v;ev('lock',{p});if(it.rank[0]&&it.rank[1])it.ph='board'}
    if(a.t==='dr_pick'&&it.ph==='board'){const turn=it.picks.length%2===0?it.first:1-it.first;const t=a.v;
      if(p!==turn||it.owner[t]!=null||!it.p[2].includes(t))return;it.owner[t]=p;it.picks.push(t);ev('pick',{p,v:t});
      if(it.picks.length===it.p[2].length){it.ph='rev';
        if(!it.partner){const items=it.p[2];for(let n=0;n<items.length;n++){const k=items.length-1-n;award(it.owner[items[k]],DPTS(k+1),{at:1200+n*520,quiet:1})}}
        else{const cols=[0,1].map(i=>drCol(it,i));let n=0;const len=Math.max(cols[0].length,cols[1].length);
          for(let k=0;k<len;k++)for(let i=0;i<2;i++){if(!cols[i][k])continue;award(i,DPTS(cols[i][k].r),{at:1200+n*500,quiet:1});n++}}}}
  },
  view(it){
    const items=it.p[2],head=`<h2 class="q">${esc(it.p[0])}</h2>${meta(it.partner?'Scored by your partner\'s ranking':esc(it.p[1]),'alt')}`;
    if(it.ph==='rank'){const st=statusOf(it.rank,'✓ locked','ranking…');
      if(it.rank[ME])return{key:Q()+'|rk|wait',status:st,html:card(`${head}${waitBox('🔒','Ranking locked',`Waiting for ${N(OTHER())}`)}`,1)};
      return{key:Q()+'|rk',status:st,html:card(`${head}<p class="lead center">Rank these for real, favorite on top. You'll each score off the other's ranking, so draft what your partner loves.</p>
        ${rkBoard(shuffle(items).map(t=>['',t]))}<div class="row"><button class="btn" id="lock">Lock in my ranking 🔒</button></div>`,1),
        mount(){const get=rkDrag($('#rk'));$('#lock').onclick=()=>{SFX.lock();act({t:'dr_rank',v:get()})}}};
    }
    if(it.ph==='board'){const turn=it.picks.length%2===0?it.first:1-it.first,mine=turn===ME;
      return{key:Q()+'|board|'+it.picks.length,turn,status:[turn===0?'picking…':'',turn===1?'picking…':''],scroll:false,html:card(`${head}
        <div class="turnbar" style="--c:var(--p${turn})"><span class="dot"></span>${mine?'Your pick':`${tag(turn)}'s pick`} <span class="cnt">Pick ${it.picks.length+1} of ${items.length}</span></div>
        <div class="dgrid">${it.grid.map(t=>{const o=it.owner[t];return `<button class="dcard ${o!=null?'own'+o:''}" data-v="${esc(t)}" ${o!=null||!mine?'disabled':''} style="--c:var(--p${turn})">${esc(t)}${o!=null?`<span class="pk">${esc(G.names[o])} #${it.picks.indexOf(t)+1}</span>`:''}</button>`}).join('')}</div>
        <div class="hint">${it.partner?'Points come from your partner\'s secret ranking.':'The real ranking stays hidden until every item is drafted.'} ${tag(it.first)} picked first this list.</div>`,it.picks.length===0&&!it.partner),
        mount(){stage.querySelectorAll('.dcard:not(:disabled)').forEach(b=>b.onclick=()=>{stage.querySelectorAll('.dcard').forEach(x=>x.disabled=true);act({t:'dr_pick',v:b.dataset.v})});if(mine&&it.picks.length)buzz([20,30,20])}};
    }
    const anim=once(Q()+'|rev');
    if(!it.partner){
      return{key:Q()+'|rev',ready:'Next',readyAt:anim?1200+items.length*520+400:0,html:card(`${head}<div class="dlist">${items.map((t,k)=>{const o=it.owner[t];
          return `<div class="drow o${o} ${anim?'':'in'}" id="dr${k}"><span class="rn">${k+1}</span><span class="t">${esc(t)}</span><span class="own">${N(o)}</span><span class="pts">+${DPTS(k+1)}</span></div>`}).join('')}</div>
        <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
        mount(){if(anim){SFX.drum();for(let n=0;n<items.length;n++){const k=items.length-1-n;setTimeout(()=>{$('#dr'+k)?.classList.add('in');k===0?(SFX.cymbal(),flash()):SFX.tick()},1200+n*520)}}
          setTimeout(()=>drVerdict(it),anim?1200+items.length*520+300:0)}};
    }
    const cols=[0,1].map(i=>drCol(it,i));
    return{key:Q()+'|rev',ready:'Next',readyAt:anim?1200+10*500+400:0,html:card(`${head}<div class="dcols">${[0,1].map(i=>`<div><h3 class="c${i}">${N(i)}'s picks</h3><div class="dlist">${cols[i].map((x,k)=>
        `<div class="drow o${i} ${anim?'':'in'}" id="d${i}_${k}"><span class="rn">${x.r}</span><span class="t">${esc(x.t)}</span><span class="pts">+${DPTS(x.r)}</span></div>`).join('')}</div><div class="hint">Numbers are ${N(1-i)}'s ranking</div></div>`).join('')}</div>
      <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
      mount(){let n=0;if(anim){SFX.drum();const len=Math.max(cols[0].length,cols[1].length);for(let k=0;k<len;k++)for(let i=0;i<2;i++){if(!cols[i][k])continue;const x=cols[i][k];setTimeout(()=>{$(`#d${i}_${k}`)?.classList.add('in');x.r===1?SFX.ding():SFX.tick()},1200+n*500);n++}}
        setTimeout(()=>drVerdict(it),anim?1200+n*500+300:0)}};
  }
};
function drCol(it,i){const o=1-i;return it.picks.filter(t=>it.owner[t]===i).map(t=>({t,r:it.partner?it.rank[o].indexOf(t)+1:it.p[2].indexOf(t)+1})).sort((a,b)=>a.r-b.r)}
function drVerdict(it){const tot=[0,1].map(i=>drCol(it,i).reduce((s,x)=>s+DPTS(x.r),0)),w=tot[0]===tot[1]?-1:tot[0]>tot[1]?0:1,v=$('#verdict');if(!v)return;
  v.innerHTML=`<div class="big ${w<0?'goldc':'good'}">${w<0?'Dead even draft!':`${N(w)} wins this list`}</div><div class="lead">${tag(0)} ${tot[0]} · ${tag(1)} ${tot[1]}</div>`;
  if(w>=0&&!onceSet.has('drh'+Q())&&onceSet.add('drh'+Q())){hype(`${G.names[w]} wins the draft!`);SFX.applause();confetti(80)}}

/* ---------- 8. On a Scale (simultaneous) ---------- */
ROUNDS.sc={
  start(){G.q={qs:queue(draw('sc',G.cfg.sc*2)),i:0}},
  init(it){it.ph='set';it.v=[null,null]},
  act(p,a,it){
    if(a.t==='sc_lock'&&it.ph==='set'&&it.v[p]==null){it.v[p]=Math.max(1,Math.min(100,+a.v|0));ev('lock',{p});
      if(it.v[0]!=null&&it.v[1]!=null){it.ph='rev';const s=it.s,g=1-s,d=Math.abs(it.v[s]-it.v[g]),last=G.q.i===G.q.qs.length-1,m=last?2:1;
        const base=d<=3?300:d<=10?200:d<=20?100:0;award(g,base*m,{at:3100,big:base===300?'Bullseye!':null,miss:!base,aww:!base})}}
  },
  view(it){
    const s=it.s,g=1-s,last=G.q.i===G.q.qs.length-1,head=`<h2 class="q">${fill(it.p[0],s)}</h2>${meta(last?'Double points':'Up to 300',last?'dbl':'')}`,st=statusOf(it.v,'✓ locked','sliding…');
    if(it.ph==='set'){
      if(it.v[ME]!=null)return{key:Q()+'|wait',status:st,html:card(`${head}${waitBox('🔒',`Locked at ${it.v[ME]}`,`Waiting for ${N(OTHER())}`)}`,1)};
      return{key:Q()+'|set',status:st,html:card(`${head}<p class="lead center">${ME===s?`Be honest. Where do you land? ${tag(g)} is guessing your number right now.`:`Where do you think ${tag(s)} lands? They're setting their number right now.`}</p>
        ${dialHTML(it,ME)}<div class="row"><button class="btn" id="lock">Lock it in 🔒</button></div>`,1),
        mount(){const d=wireDial();$('#lock').onclick=()=>{SFX.lock();act({t:'sc_lock',v:+d.value})}}};
    }
    const anim=once(Q()+'|rev'),a=it.v[s],gu=it.v[g],dist=Math.abs(a-gu),m=last?2:1;
    const [base,label,cls]=dist<=3?[300,'Bullseye!','goldc']:dist<=10?[200,'So close!','good']:dist<=20?[100,'Not bad!','good']:[0,'Way off!','badc'];
    const pos=v=>`${(v-1)/99*100}%`,band=(w,c)=>{const lo=Math.max(1,a-w),hi=Math.min(100,a+w);return `<div class="band ${c}" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>`};
    return{key:Q()+'|rev',ready:'Next',readyAt:anim?3300:0,html:card(`${head}
      <div class="meter"><div class="track"></div>${band(20,'b20')}${band(10,'b10')}${band(3,'b3')}
        <div class="mk top ${anim?'hide':''}" id="mA" style="left:${anim?'0%':pos(a)}"><span class="lbl c${s}">${N(s)}</span><span class="val c${s}" id="mAv">${anim?1:a}</span><span class="stem" style="background:var(--p${s})"></span></div>
        <div class="mk bot" style="left:${pos(gu)}"><span class="lbl c${g}">${N(g)}'s guess</span><span class="val c${g}">${gu}</span><span class="stem" style="background:var(--p${g})"></span></div></div>
      <div class="ticks"><span>1</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
      <div class="ends" style="margin:4px 8px 0"><div>${esc(it.p[1])}</div><div>${esc(it.p[2])}</div></div>
      <div class="verdict" id="verdict"></div><div class="row" id="ctl"></div>`),
      mount(){if(anim){SFX.drum();setTimeout(()=>{const mk=$('#mA');if(!mk)return;mk.classList.remove('hide');void mk.offsetWidth;mk.style.left=pos(a);SFX.slide();const el=$('#mAv'),t0=performance.now();
          const f=n=>{const k=Math.min(1,(n-t0)/1600);if(el)el.textContent=Math.round(1+(a-1)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)},1300)}
        setTimeout(()=>{stage.querySelectorAll('.band').forEach(b=>b.classList.add('on'));const v=$('#verdict');if(v)v.innerHTML=`<div class="big ${cls}">${label}</div><div class="lead">${N(s)} said <b>${a}</b>, ${N(g)} guessed <b>${gu}</b>. Off by ${dist}. ${base?`${tag(g)} gets +${base*m}${m>1?' (doubled)':''}`:'No points.'}</div>`;if(base&&base<300&&anim)SFX.right()},anim?3100:0)}};
  }
};

/* =====================================================================
   BOOT
   ===================================================================== */
function bulbs(){const pl=$('#plate');pl.querySelectorAll('.bulb').forEach(b=>b.remove());const w=pl.offsetWidth,h=pl.offsetHeight,inset=8,gap=22;const pts=[];
  const nx=Math.max(2,Math.round((w-2*inset)/gap)),ny=Math.max(1,Math.round((h-2*inset)/gap));
  for(let k=0;k<=nx;k++)pts.push([inset+k*(w-2*inset)/nx,inset]);for(let k=1;k<=ny;k++)pts.push([w-inset,inset+k*(h-2*inset)/ny]);
  for(let k=nx-1;k>=0;k--)pts.push([inset+k*(w-2*inset)/nx,h-inset]);for(let k=ny-1;k>=1;k--)pts.push([inset,inset+k*(h-2*inset)/ny]);
  pts.forEach(([x,y],i)=>{const b=document.createElement('span');b.className='bulb';b.style.left=x+'px';b.style.top=y+'px';b.style.animationDelay=(-(i%8)*.2)+'s';pl.appendChild(b)})}
function syncCtrls(){$('#snd').classList.toggle('off',!PREF.sound);$('#snd').textContent=PREF.sound?'🔊':'🔇';$('#mic').classList.toggle('off',!PREF.voice)}
$('#snd').onclick=()=>{PREF.sound=PREF.sound?0:1;savePref();syncCtrls()};
$('#mic').onclick=()=>{PREF.voice=PREF.voice?0:1;savePref();syncCtrls();if(PREF.voice)speak('Announcer on');else try{speechSynthesis.cancel()}catch(e){}};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
let wake=null;async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(ROLE==='guest'&&!LOCAL&&!netOK)setTimeout(dial,300)}});
addEventListener('pointerdown',keepAwake,{once:true});
addEventListener('resize',()=>{bulbs();sizeFx();seedAmb()});
sizeFx();seedAmb();requestAnimationFrame(ambLoop);bulbs();syncCtrls();renderLanding();
</script>
