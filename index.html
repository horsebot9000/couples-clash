<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e0835">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Couple's Clash</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --p0:#ff3d7f; --p1:#2fd6ff; --gold:#ffd23f; --ok:#2ee59d; --bad:#ff4d4d;
  --deep:#2a0f4a; --deep2:#1a0630; --line:rgba(255,255,255,.14);
  --bg1:#5a1f8f; --bg2:#1e0835; --bg3:#07010e; --plate1:#d0153a; --plate2:#760720; --hl:#ffd23f;
  --display: Impact, "Arial Black", "Franklin Gothic Heavy", sans-serif;
}
body.spicy{--bg1:#8a0b2e; --bg2:#2a0312; --bg3:#060003; --deep:#3b0b1f; --deep2:#22040f; --plate1:#2a0010; --plate2:#0a0004; --hl:#ff5577}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#07010e}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow-x:hidden;min-height:100vh;
  background:radial-gradient(ellipse at 50% -10%,var(--bg1) 0%,var(--bg2) 48%,var(--bg3) 100%) fixed;transition:background .6s}
button{font-family:inherit}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#burst{position:fixed;inset:0;z-index:60;pointer-events:none}
.beams{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beams i{position:absolute;top:-10%;width:36vw;height:130vh;transform-origin:top center;filter:blur(12px);
  background:linear-gradient(180deg,rgba(255,236,190,.17),rgba(255,236,190,0) 75%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
body.spicy .beams i{background:linear-gradient(180deg,rgba(255,80,120,.2),rgba(255,80,120,0) 75%)}
.beams i:nth-child(1){left:0;animation:sway 9s ease-in-out infinite alternate}
.beams i:nth-child(2){right:0;animation:sway 11s ease-in-out infinite alternate-reverse}
.beams i:nth-child(3){left:32vw;width:30vw;opacity:.6;animation:sway 13s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
.floor{position:fixed;left:-10%;right:-10%;bottom:-30vh;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,210,63,.13),transparent 60%)}
body.spicy .floor{background:radial-gradient(ellipse at 50% 0%,rgba(255,40,90,.2),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:14px 16px 70px}
.wrap.shake{animation:shake2 .45s}
@keyframes shake2{15%,55%{transform:translate(-9px,3px)}35%,75%{transform:translate(9px,-3px)}}

/* top controls */
.ctrls{position:fixed;top:12px;right:12px;z-index:70;display:flex;gap:8px}
.ctrls button{background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border:1px solid var(--line);color:#fff;border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;transition:.2s}
.ctrls button:hover{border-color:var(--gold);transform:translateY(-2px)}
.ctrls button.off{opacity:.45}

/* marquee */
.marquee{position:relative;margin:6px auto 2px;width:fit-content;padding:18px 44px;border-radius:20px;
  background:linear-gradient(var(--plate1),var(--plate2));box-shadow:0 0 0 5px var(--gold),0 0 50px rgba(255,210,63,.35),inset 0 2px 0 rgba(255,255,255,.2);transition:.5s}
body.spicy .marquee{box-shadow:0 0 0 5px #ff3d6e,0 0 60px rgba(255,40,100,.55),inset 0 2px 0 rgba(255,255,255,.12)}
.marquee h1{margin:0;font-family:var(--display);font-size:clamp(30px,6.6vw,64px);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(100deg,#ffd23f 0%,#ffd23f 40%,#fff8d6 50%,#ffd23f 60%,#ffd23f 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a4a00) drop-shadow(0 0 14px rgba(255,210,63,.5));
  animation:shine 4s linear infinite}
body.spicy .marquee h1{background-image:linear-gradient(100deg,#ff5f8f 0%,#ff5f8f 40%,#fff 50%,#ff5f8f 60%,#ff5f8f 100%);filter:drop-shadow(0 3px 0 #5a0020) drop-shadow(0 0 16px rgba(255,60,120,.8))}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.bulb{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#6e4f0c;animation:chase 1.6s linear infinite}
body.spicy .bulb{animation-name:chaseR}
@keyframes chase{0%,30%{background:#fff6c8;box-shadow:0 0 9px 3px #ffd23f}31%,100%{background:#6e4f0c;box-shadow:none}}
@keyframes chaseR{0%,30%{background:#ffd0dc;box-shadow:0 0 9px 3px #ff3d6e}31%,100%{background:#5a0b20;box-shadow:none}}
.neon{display:none;position:absolute;right:-14px;bottom:-22px;transform:rotate(-8deg);font:italic 800 26px/1 "Brush Script MT","Segoe Script",cursive;color:#fff;
  text-shadow:0 0 6px #ff3d6e,0 0 14px #ff3d6e,0 0 30px #ff0055;animation:flicker 4s infinite}
body.spicy .neon{display:block}
@keyframes flicker{0%,19%,22%,62%,64%,100%{opacity:1}20%,21%,63%{opacity:.35}}
.tagline{text-align:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin:16px 0 16px}

/* scoreboard */
.board{display:none;grid-template-columns:1fr auto 1fr;gap:14px;margin-bottom:18px}
.pod{position:relative;border-radius:18px;padding:12px 14px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:2px solid var(--line);
  text-align:center;transition:.3s;min-width:0}
.pname{font-family:var(--display);font-size:clamp(16px,2.6vw,24px);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:"Courier New",ui-monospace,monospace;font-weight:900;font-size:clamp(30px,5vw,50px);line-height:1.1;margin-top:2px}
#pod0 .pname,#pod0 .score{color:var(--p0)} #pod0 .score{text-shadow:0 0 16px var(--p0)}
#pod1 .pname,#pod1 .score{color:var(--p1)} #pod1 .score{text-shadow:0 0 16px var(--p1)}
.pod.active{transform:translateY(-4px) scale(1.04)}
#pod0.active{border-color:var(--p0);box-shadow:0 0 34px var(--p0),inset 0 0 20px rgba(255,61,127,.25)}
#pod1.active{border-color:var(--p1);box-shadow:0 0 34px var(--p1),inset 0 0 20px rgba(47,214,255,.25)}
.pod.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.1)}}
.crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:30px;opacity:0;transition:.4s;filter:drop-shadow(0 0 8px gold)}
.pod.leader .crown{opacity:1;animation:crownBob 2s ease-in-out infinite}
@keyframes crownBob{50%{transform:translateX(-50%) rotate(8deg) translateY(-4px)}}
.streak{position:absolute;top:8px;right:10px;font-family:var(--display);font-size:15px;color:#ffb03f;text-shadow:0 0 10px #ff6a00;opacity:0;transition:.3s}
.pod.hot .streak{opacity:1;animation:pulse 1s ease-in-out infinite}
.roundtag{align-self:center;font-family:var(--display);color:var(--gold);text-align:center;font-size:14px;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.float{position:absolute;left:50%;top:35%;font-family:var(--display);font-size:32px;pointer-events:none;animation:floatUp 1.3s ease-out forwards;text-shadow:0 2px 8px #000}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(1.3)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* cards */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);
  border-radius:24px;padding:clamp(18px,3vw,34px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter:blur(4px);animation:cardIn .55s cubic-bezier(.2,.9,.25,1.1)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,210,63,.6),transparent 30%,transparent 70%,rgba(255,61,127,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card.rr-pad{padding-top:62px}
@keyframes cardIn{from{opacity:0;transform:perspective(1200px) rotateX(14deg) translateY(34px) scale(.95);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.center{text-align:center}
.q{font-size:clamp(22px,3.6vw,34px);font-weight:850;line-height:1.22;margin:0 0 10px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.hl{color:var(--hl)}
.meta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.pips{display:flex;gap:6px}
.pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);transition:.3s}
.pips i.done{background:var(--gold)}
.pips i.cur{background:#fff;box-shadow:0 0 10px #fff;transform:scale(1.25)}
.chip-pts{font-family:var(--display);font-size:13px;letter-spacing:.1em;background:var(--gold);color:var(--deep);padding:4px 11px;border-radius:99px;white-space:nowrap}
.chip-pts.dbl{background:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
.chip-pts.alt{background:rgba(255,255,255,.12);color:#fff}
.bigtitle{font-family:var(--display);font-size:clamp(44px,9vw,92px);letter-spacing:.04em;text-transform:uppercase;line-height:1;margin:12px 0;
  background:linear-gradient(#fff6c8,#ffd23f 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
body.spicy .bigtitle{background-image:linear-gradient(#ffe0ea,#ff5f8f 55%,#ff1f5a)}
.lead{font-size:clamp(16px,2.2vw,19px);line-height:1.5;opacity:.92;max-width:680px;margin:10px auto}
.hint{font-size:12px;opacity:.5;margin-top:10px;text-align:center}
.c0{color:var(--p0);font-weight:800}.c1{color:var(--p1);font-weight:800}
.status{margin-top:16px;text-align:center;font-family:var(--display);letter-spacing:.05em;font-size:clamp(18px,3vw,26px);text-transform:uppercase;min-height:1.3em}
.status .c0,.status .c1{font-weight:400}
.good{color:var(--ok)} .badc{color:var(--bad)} .goldc{color:var(--gold)}

.btn{position:relative;overflow:hidden;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:18px;border:0;border-radius:14px;padding:14px 28px;cursor:pointer;
  color:var(--deep2);background:linear-gradient(#ffe88f,#ffbf1f);box-shadow:0 5px 0 #a86f00,0 10px 26px rgba(0,0,0,.4),0 0 24px rgba(255,210,63,.25);transition:transform .08s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover::after{left:130%}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a86f00}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.red{background:linear-gradient(#ff7676,#d61f2c);color:#fff;box-shadow:0 5px 0 #7a0d14}
.btn.small{font-size:14px;padding:9px 16px}
.btn.huge{font-size:24px;padding:18px 44px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.reroll{position:absolute;top:14px;right:14px;z-index:3;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;cursor:pointer;
  background:rgba(0,0,0,.35);border:2px solid var(--gold);color:var(--gold);font:800 14px system-ui,sans-serif;letter-spacing:.02em;transition:.2s}
.reroll:hover{background:var(--gold);color:var(--deep2);box-shadow:0 0 18px rgba(255,210,63,.6)}
.reroll .die{display:inline-block;font-size:18px;transition:transform .5s}
.reroll:hover .die{transform:rotate(360deg)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:rgba(0,0,0,.8);border:1px solid var(--gold);
  color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

input[type=text]{font:700 20px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.35);border:2px solid var(--line);border-radius:12px;padding:14px 16px;width:100%;outline:none;transition:.2s}
input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,210,63,.15)}
input.secret{-webkit-text-security:disc}
select{font:600 15px system-ui,sans-serif;color:#fff;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:5px 8px;margin-left:6px}
.inrow{display:flex;gap:10px;max-width:560px;margin:16px auto 0}
.inrow .btn{padding:10px 18px;flex:none}
.shake-it{animation:shake .4s;border-color:var(--bad)!important}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pulse{50%{transform:scale(1.03)}}

/* overlays */
#curtain{position:fixed;inset:0;z-index:55;pointer-events:none}
#curtain .cur{position:absolute;top:0;bottom:0;width:51%;transition:transform .6s cubic-bezier(.7,0,.3,1);
  background:repeating-linear-gradient(90deg,#5a0612 0,#a3132a 30px,#d01c38 46px,#8a0e22 64px,#5a0612 90px);box-shadow:inset 0 -60px 80px rgba(0,0,0,.5)}
#curtain .cur::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 20%,transparent 80%,rgba(0,0,0,.5))}
#curtain .l{left:0;transform:translateX(-102%)}
#curtain .r{right:0;transform:translateX(102%)}
#curtain.closed .l,#curtain.closed .r{transform:none}
#curtain .val{position:absolute;top:0;left:0;right:0;height:54px;background:repeating-linear-gradient(90deg,#7a0a1c 0,#c4142c 22px,#7a0a1c 44px);
  border-bottom:4px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.6);transform:translateY(-110%);transition:transform .4s}
#curtain.closed .val{transform:none}
#flash{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%)}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
#hype{position:fixed;inset:0;z-index:59;pointer-events:none;display:grid;place-items:center}
#hype span{font-family:var(--display);font-size:clamp(48px,11vw,130px);letter-spacing:.04em;text-transform:uppercase;text-align:center;line-height:.95;opacity:0;padding:0 20px;
  background:linear-gradient(#fff,#ffd23f 50%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(255,180,0,.6))}
#hype span.bad{background-image:linear-gradient(#fff,#ff7a7a 50%,#c40020);filter:drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 30px rgba(255,0,0,.5))}
#hype span.on{animation:stamp 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}14%{opacity:1;transform:scale(1) rotate(-4deg)}75%{opacity:1;transform:scale(1.04) rotate(-4deg)}100%{opacity:0;transform:scale(1.2) rotate(-4deg)}}
#bigx{position:fixed;inset:0;display:none;place-items:center;z-index:57;pointer-events:none}
#bigx.on{display:grid;animation:xpop .9s ease-out forwards}
#bigx span{font-family:var(--display);font-size:min(40vw,320px);color:var(--bad);text-shadow:0 0 40px rgba(255,0,0,.8),0 10px 0 #600;letter-spacing:.1em}
@keyframes xpop{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* setup */
.sec{font-family:var(--display);font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-size:22px;margin:24px 0 12px;text-align:center}
.sec:first-child{margin-top:0}
.setup{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.field input{text-align:center;font-size:22px}
.field.f0 input{border-color:rgba(255,61,127,.5)} .field.f1 input{border-color:rgba(47,214,255,.5)}
.field.f0 input:focus{border-color:var(--p0)} .field.f1 input:focus{border-color:var(--p1)}
.vs{font-family:var(--display);font-size:38px;color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.6)}
.heat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:0 auto}
.heat button{padding:14px 10px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;cursor:pointer;transition:.2s;text-align:center}
.heat button b{display:block;font-family:var(--display);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:18px;margin-top:4px}
.heat button small{display:block;font-size:12px;opacity:.75;margin-top:3px}
.heat button .em{font-size:28px}
.heat button.on{border-color:var(--gold);background:rgba(255,210,63,.12);box-shadow:0 0 22px rgba(255,210,63,.3)}
.heat button[data-h=spicy].on,.heat button[data-h=mixed].on{border-color:#ff3d6e;background:rgba(255,40,100,.15);box-shadow:0 0 26px rgba(255,40,100,.45)}
.heatnote{text-align:center;font-size:13px;opacity:.7;margin-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;text-align:left}
.rcard{position:relative;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px 60px;cursor:pointer;transition:.2s;opacity:.5;user-select:none}
.rcard:hover{opacity:.85;transform:translateY(-2px)}
.rcard.on{opacity:1;border-color:var(--gold);background:linear-gradient(135deg,rgba(255,210,63,.12),rgba(0,0,0,.2))}
.rcard .rem{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.08);transition:.2s}
.rcard.on .rem{background:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.5)}
.rcard b{display:block;font-family:var(--display);font-weight:400;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;font-size:17px}
.rcard p{margin:4px 0 10px;font-size:13.5px;opacity:.88;line-height:1.4}
.rcard .ro{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;opacity:.92}
.rcard .only{margin-left:auto;background:none;border:1px solid var(--line);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;opacity:.8}
.rcard .only:hover{border-color:var(--gold);opacity:1}

/* round intro */
.intro{text-align:center;padding-top:34px}
.medal-r{width:120px;height:120px;margin:0 auto;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd23f 45%,#b37a00 100%);box-shadow:0 0 0 6px rgba(255,210,63,.25),0 0 50px rgba(255,210,63,.5);animation:spinIn .9s cubic-bezier(.2,1.3,.4,1)}
body.spicy .medal-r{background:radial-gradient(circle at 35% 30%,#ffe0ea,#ff3d6e 45%,#7a0020 100%);box-shadow:0 0 0 6px rgba(255,61,110,.25),0 0 50px rgba(255,40,100,.6)}
.medal-r span{font-family:var(--display);font-size:64px;color:var(--deep2);line-height:1}
.medal-r small{position:absolute;bottom:16px;font:800 11px system-ui;letter-spacing:.1em;color:var(--deep2);opacity:.75}
.medal-r .rem2{position:absolute;top:-14px;right:-14px;font-size:40px;animation:bob 2s ease-in-out infinite}
@keyframes spinIn{from{transform:rotateY(540deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-8px) rotate(10deg)}}
.intro .bigtitle{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit}
.intro .bigtitle span{display:inline-block;animation:drop .6s cubic-bezier(.2,1.5,.4,1) both;background:linear-gradient(#fff6c8,#ffd23f 55%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
body.spicy .intro .bigtitle span{background-image:linear-gradient(#ffe0ea,#ff5f8f 55%,#ff1f5a)}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-10deg)}}
.rules-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.rules-chips span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.spicytag{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:99px;background:rgba(255,40,100,.2);border:1px solid #ff3d6e;font-weight:800;font-size:13px}

/* look away */
.lookaway{margin:4px auto 14px;max-width:560px;text-align:center;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;
  font-size:clamp(20px,3.4vw,30px);padding:14px;border-radius:14px;animation:pulse 1.2s ease-in-out infinite}
.bg0{background:repeating-linear-gradient(45deg,rgba(255,61,127,.35) 0 14px,rgba(255,61,127,.15) 14px 28px);border:2px solid var(--p0)}
.bg1{background:repeating-linear-gradient(45deg,rgba(47,214,255,.32) 0 14px,rgba(47,214,255,.12) 14px 28px);border:2px solid var(--p1)}
.lockedmsg{text-align:center;font-size:15px;opacity:.85;margin-bottom:6px}

/* know me */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.flip{perspective:900px;height:160px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.show .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.front{background:repeating-linear-gradient(45deg,#3a1466 0 12px,#2a0f4a 12px 24px);border:2px solid var(--gold);font-family:var(--display);font-size:54px;color:var(--gold)}
body.spicy .front{background:repeating-linear-gradient(45deg,#4a0a22 0 12px,#300616 12px 24px)}
.back{transform:rotateY(180deg);background:var(--deep);border:2px solid}
.back.b0{border-color:var(--p0);box-shadow:0 0 22px rgba(255,61,127,.4)}
.back.b1{border-color:var(--p1);box-shadow:0 0 22px rgba(47,214,255,.4)}
.who{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.ans{font-size:clamp(18px,2.8vw,26px);font-weight:800;word-break:break-word}
#judgeq{transition:opacity .4s}

/* top list */
.listin{max-width:520px;margin:12px auto 0;display:grid;gap:10px}
.listin label{display:flex;align-items:center;gap:10px}
.listin .rk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--gold);color:var(--deep)}
.listin input{padding:10px 14px;font-size:18px}
.fboard{max-width:620px;margin:6px auto 0;padding:14px;border-radius:20px;background:linear-gradient(#0b2a7a,#06164a);
  border:4px solid var(--gold);box-shadow:0 0 30px rgba(255,210,63,.3),inset 0 0 30px rgba(0,0,0,.5);display:grid;gap:8px}
body.spicy .fboard{background:linear-gradient(#5a0626,#2a0010)}
.tile{perspective:800px;height:60px}
.tile .inner{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.show .inner{transform:rotateX(180deg)}
.tile .tf,.tile .tb{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center}
.tile .tf{justify-content:center;background:linear-gradient(#2a5ae0,#123a9e);border:2px solid #6f95ff}
body.spicy .tile .tf{background:linear-gradient(#c4144a,#7a0a2c);border-color:#ff7aa0}
.tile .tf .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.6);font-family:var(--display);font-size:22px}
.tile .tb{transform:rotateX(180deg);background:linear-gradient(#3a6af0,#1a46b8);border:2px solid #fff;padding:0 8px 0 18px;justify-content:space-between;gap:10px}
body.spicy .tile .tb{background:linear-gradient(#ff3d6e,#a3133e)}
.tile .txt{font-family:var(--display);font-size:clamp(17px,2.6vw,24px);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tp{flex:none;min-width:58px;height:44px;display:grid;place-items:center;border-radius:8px;background:rgba(0,0,0,.4);font-family:var(--display);font-size:22px;color:var(--gold)}
.tile.missed .tb{background:linear-gradient(#4a4a5e,#2a2a3a);border-color:#888}
.tile.missed .tp{color:#999}
.strikes{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.strikes span{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:30px;border:3px solid rgba(255,77,77,.3);color:rgba(255,77,77,.25)}
.strikes span.on{border-color:var(--bad);color:var(--bad);background:rgba(255,77,77,.12);box-shadow:0 0 16px rgba(255,77,77,.5)}
.judgebox{max-width:640px;margin:14px auto 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);border:2px dashed var(--gold);text-align:center}
.judgebox .row{margin-top:10px}
.judgebox .btn{font-size:15px;padding:10px 16px}
.judgebox .pk{display:none;text-transform:none;font-family:system-ui,sans-serif;font-weight:700;letter-spacing:0}
.judgebox.peeking .pk{display:inline}
.linkbtn{background:none;border:1px dashed rgba(255,255,255,.35);color:#fff;opacity:.8;border-radius:99px;padding:6px 14px;font:600 13px system-ui,sans-serif;cursor:pointer}
.linkbtn:hover{opacity:1;border-color:var(--gold)}

/* rank it */
.rk-wrap{max-width:560px;margin:4px auto 0}
.rk-end{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.85;margin:8px 0 8px 2px}
.rk{--h:66px;--g:10px;--rail:58px;position:relative;height:calc(var(--n)*(var(--h) + var(--g)) - var(--g))}
.rk.compact{--h:48px;--g:7px;--rail:50px}
.rk-slot{position:absolute;left:0;right:0;top:calc(var(--k)*(var(--h) + var(--g)));height:var(--h);display:flex;align-items:center;gap:12px;--hue:calc(45 + var(--t)*230)}
body.spicy .rk-slot,body.spicy .rk-tile{--hue:calc(350 - var(--t)*80)}
.rk-badge{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#1a0630;
  background:radial-gradient(circle at 35% 30%,hsl(var(--hue) 100% 85%),hsl(var(--hue) 85% 58%) 60%,hsl(var(--hue) 70% 38%));box-shadow:0 0 14px hsla(var(--hue),90%,60%,.45)}
.rk.compact .rk-badge{width:36px;height:36px;font-size:17px}
.rk-hole{flex:1;height:100%;border-radius:16px;border:2px dashed rgba(255,255,255,.12);background:rgba(0,0,0,.18)}
.rk-tile{--hue:calc(45 + var(--t)*230);position:absolute;left:var(--rail);right:0;top:0;height:var(--h);display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;
  border-radius:16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;z-index:1;
  background:linear-gradient(100deg,hsla(var(--hue),90%,58%,.55),hsla(var(--hue),70%,30%,.55) 45%,rgba(30,8,55,.97) 75%);
  border:2px solid hsl(var(--hue) 85% 65%);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  transition:top .26s cubic-bezier(.2,.9,.25,1),opacity .3s,transform .18s,box-shadow .18s,border-color .26s}
.rk-tile.drag{cursor:grabbing;z-index:10;transform:scale(1.04) rotate(-.8deg);transition:transform .18s,box-shadow .18s,border-color .26s;
  box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 26px hsla(var(--hue),90%,60%,.6)}
.rk-emo{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(0,0,0,.28)}
.rk-emo:empty{display:none}
.rk.compact .rk-emo{width:32px;height:32px;font-size:19px}
.rk-txt{flex:1;min-width:0;font-weight:800;font-size:clamp(16px,2.4vw,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rk.compact .rk-txt{font-size:16px}
.rk-arrows{display:flex;flex-direction:column;gap:3px}
.rk-arrows button{width:30px;height:24px;border-radius:7px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:10px;cursor:pointer}
.rk.compact .rk-arrows button{height:19px}
.rk-arrows button:hover{background:rgba(255,255,255,.28)}
.rk-grip{font-size:22px;opacity:.55;padding:0 4px}
.rr-wrap{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr);max-width:720px;margin:6px auto 0}
.rr-h{text-align:center;font-family:var(--display);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:15px;margin-bottom:10px}
.rr-body{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr);position:relative}
.rr-col{display:grid;gap:10px}
.rr-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.rr-svg path{fill:none;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.rr-svg path.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow .45s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.rr{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px 0 8px;border-radius:14px;background:var(--deep);border:2px solid rgba(255,255,255,.18);transition:.3s}
.rr-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--deep);font-family:var(--display);font-size:16px}
.rr .rk-emo{width:36px;height:36px;font-size:21px}
.rr-t{flex:1;min-width:0;font-weight:800;font-size:clamp(14px,2.1vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr.hidden{background:repeating-linear-gradient(45deg,#3a1466 0 10px,#2a0f4a 10px 20px);border-color:var(--gold)}
.rr.hidden .rr-t{font-family:var(--display);color:var(--gold);font-size:24px}
.rr-flip{perspective:700px;height:58px}
.rr-in{position:relative;height:100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.rr-flip.show .rr-in{transform:rotateX(180deg)}
.rr-in>.rr{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rr-in>.rr.back{transform:rotateX(180deg)}
.rr .chip{flex:none;font-family:var(--display);font-size:15px;letter-spacing:.04em;padding:3px 8px;border-radius:8px;display:none}
.rr.hit,.rr.near,.rr.miss{transform:scale(1.02)}
.rr.hit{border-color:var(--ok);background:linear-gradient(90deg,#0d5a3c,var(--deep))}
.rr.near{border-color:var(--gold);background:linear-gradient(90deg,#5a470d,var(--deep))}
.rr.miss{border-color:var(--bad);background:linear-gradient(90deg,#5a0f1a,var(--deep))}
.rr-in>.rr.back.hit,.rr-in>.rr.back.near,.rr-in>.rr.back.miss{transform:rotateX(180deg)}
.rr.hit .chip{display:block;background:var(--ok);color:#06301f}
.rr.near .chip{display:block;background:var(--gold);color:var(--deep)}
.rr.miss .chip{display:block;background:var(--bad);color:#fff}
.verdict{text-align:center;margin-top:14px}
.verdict .big{font-family:var(--display);font-size:clamp(28px,5vw,46px);letter-spacing:.04em;text-transform:uppercase}

/* same page */
.sublabel{font-size:17px;text-align:center;margin:16px 0 8px;opacity:.95;font-weight:700}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto}
.ch-btn{padding:18px 14px;border-radius:16px;background:var(--deep);border:2px solid rgba(255,255,255,.2);color:#fff;font:800 clamp(16px,2.4vw,21px)/1.25 system-ui,sans-serif;cursor:pointer;transition:.18s}
.ch-btn:hover{border-color:rgba(255,210,63,.6);transform:translateY(-2px)}
.ch-btn.sel{border-color:var(--gold);background:linear-gradient(#6a520e,var(--deep));box-shadow:0 0 20px rgba(255,210,63,.45)}
.ch-btn.n0.sel{border-color:var(--p0);background:linear-gradient(rgba(255,61,127,.45),var(--deep));box-shadow:0 0 20px rgba(255,61,127,.5)}
.ch-btn.n1.sel{border-color:var(--p1);background:linear-gradient(rgba(47,214,255,.4),var(--deep));box-shadow:0 0 20px rgba(47,214,255,.5)}
.ch-btn.big{padding:30px 14px;font-size:clamp(20px,3.4vw,30px);font-family:var(--display);font-weight:400;letter-spacing:.05em;text-transform:uppercase}
.sp-res{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px;margin:10px auto 0}
.sp-card{border-radius:16px;padding:16px;background:rgba(0,0,0,.3);border:2px solid var(--line);text-align:center;opacity:0;transform:translateY(10px) scale(.97);transition:.4s}
.sp-card.in{opacity:1;transform:none}
.sp-card.v0{border-color:var(--p0)} .sp-card.v1{border-color:var(--p1)}
.spk{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:10px}
.spk:first-child{margin-top:0}
.spv{font-weight:800;font-size:clamp(17px,2.6vw,22px);margin-top:3px}
.spv.pred{opacity:0;transition:.4s}
.spv.pred.in{opacity:1}
.spv.big{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,38px);letter-spacing:.04em;text-transform:uppercase}

/* pick three */
.p3slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:660px;margin:6px auto 14px}
.p3slot{min-height:74px;border-radius:16px;border:2px dashed rgba(255,255,255,.3);background:rgba(0,0,0,.25);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:.2s}
.p3slot .medal{font-size:26px;line-height:1}
.p3slot .st{font-weight:800;font-size:15px;opacity:.6;text-align:center}
.p3slot.on{border-style:solid;border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),rgba(0,0,0,.3));box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);animation:pop2 .3s}
.p3slot.on .st{opacity:1}
@keyframes pop2{50%{transform:scale(1.06)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;margin:0 auto}
.chip{padding:10px 15px;border-radius:99px;border:2px solid rgba(255,255,255,.2);background:var(--deep);color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer;transition:.15s;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:rgba(255,255,255,.55);transform:translateY(-2px)}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 35%,var(--deep));box-shadow:0 0 14px color-mix(in srgb,var(--c) 50%,transparent)}
.chip.add{border-style:dashed;border-color:var(--gold);color:var(--gold);background:transparent}
.chip.real{border-color:var(--ok);background:rgba(46,229,157,.18)}
.chip.wrong{border-color:var(--bad);background:rgba(255,77,77,.18);text-decoration:line-through;opacity:.85}
.chip.dim{opacity:.35}
.p3custom{display:flex;justify-content:center;margin-top:12px}
.p3custom .inrow{margin:0}
.p3rev{max-width:700px;margin:0 auto;display:grid;gap:14px}
.p3row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.p3lab{text-align:center;font-weight:800;margin-bottom:-6px}
.p3card{border-radius:16px;min-height:86px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;
  background:var(--deep);border:2px solid rgba(255,255,255,.2);transition:.35s;position:relative}
.p3card .medal{font-size:24px}
.p3card .t{font-weight:800;font-size:16px}
.p3card .chip2{font-family:var(--display);font-size:14px;padding:2px 8px;border-radius:8px;margin-top:2px;display:none}
.p3card.hidden .t{opacity:0}
.p3card.hidden{background:repeating-linear-gradient(45deg,#3a1466 0 10px,#2a0f4a 10px 20px);border-color:var(--gold)}
body.spicy .p3card.hidden{background:repeating-linear-gradient(45deg,#4a0a22 0 10px,#300616 10px 20px)}
.p3card.flipin{animation:flipX .5s}
@keyframes flipX{0%{transform:rotateY(90deg)}100%{transform:none}}
.p3card.exact{border-color:var(--gold);background:linear-gradient(#5a470d,var(--deep));box-shadow:0 0 22px rgba(255,210,63,.5)}
.p3card.hit{border-color:var(--ok);background:linear-gradient(#0d5a3c,var(--deep))}
.p3card.miss{border-color:var(--bad);background:linear-gradient(#5a0f1a,var(--deep))}
.p3card.exact .chip2{display:block;background:var(--gold);color:var(--deep)}
.p3card.hit .chip2{display:block;background:var(--ok);color:#06301f}
.p3card.miss .chip2{display:block;background:var(--bad);color:#fff}

/* fib */
.fibin{max-width:560px;margin:10px auto 0;display:grid;gap:10px}
.fibin label{display:flex;align-items:center;gap:10px}
.fibin .tg{flex:none;width:86px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:15px;text-align:right}
.fibin .tg.t{color:var(--ok)} .fibin .tg.f{color:#ff9a9a}
.fibs{display:grid;gap:12px;max-width:640px;margin:8px auto 0}
.fibcard{position:relative;display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--deep);border:2px solid rgba(255,255,255,.2);
  color:#fff;font:800 clamp(17px,2.6vw,22px)/1.3 system-ui,sans-serif;cursor:pointer;text-align:left;transition:.2s;overflow:hidden}
.fibcard .ltr{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:400;background:var(--gold);color:var(--deep)}
.fibcard:hover{border-color:rgba(255,210,63,.6)}
.fibcard.sel{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 22%,var(--deep))}
.fibcard .stamp{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(-12deg) scale(2);opacity:0;font-family:var(--display);font-size:28px;letter-spacing:.1em;
  padding:2px 12px;border:4px solid;border-radius:8px;transition:.35s cubic-bezier(.2,1.5,.4,1)}
.fibcard.isfib .stamp{opacity:1;transform:translateY(-50%) rotate(-12deg) scale(1);color:var(--bad);border-color:var(--bad)}
.fibcard.istruth .stamp{opacity:1;transform:translateY(-50%) rotate(-12deg) scale(1);color:var(--ok);border-color:var(--ok)}
.fibcard.isfib{opacity:.6}
.fibcard.istruth{border-color:var(--ok);box-shadow:0 0 28px rgba(46,229,157,.5);opacity:1}

/* draft */
.turnbar{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:clamp(20px,3.2vw,28px)}
.turnbar .dot{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);animation:pulse .8s ease-in-out infinite}
.turnbar .cnt{font-family:system-ui;font-size:14px;letter-spacing:0;text-transform:none;opacity:.7}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:720px;margin:0 auto}
.dcard{position:relative;min-height:62px;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:var(--deep);color:#fff;font:800 clamp(15px,2.3vw,19px)/1.25 system-ui,sans-serif;
  cursor:pointer;text-align:left;transition:.2s;display:flex;align-items:center;gap:10px}
.dcard:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent);transform:translateY(-2px)}
.dcard:disabled{cursor:default}
.dcard.own0{border-color:var(--p0);background:linear-gradient(90deg,rgba(255,61,127,.35),var(--deep));animation:pop2 .35s}
.dcard.own1{border-color:var(--p1);background:linear-gradient(90deg,rgba(47,214,255,.3),var(--deep));animation:pop2 .35s}
.dcard .pk{margin-left:auto;flex:none;font-family:var(--display);font-weight:400;font-size:13px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.4)}
.dlist{max-width:640px;margin:0 auto;display:grid;gap:8px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--deep);border:2px solid rgba(255,255,255,.15);opacity:0;transform:translateX(-20px);transition:.4s}
.drow.in{opacity:1;transform:none}
.drow .rn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--gold);color:var(--deep)}
.drow .t{flex:1;font-weight:800;font-size:clamp(15px,2.3vw,19px);min-width:0}
.drow .own{flex:none;font-family:var(--display);font-size:14px;letter-spacing:.04em;padding:4px 10px;border-radius:8px}

function smartCase(s){
  s=s.trim().replace(/\s+/g,' ');if(!s)return s;
  const SMALL=new Set(['and','or','of','the','a','an','in','on','to','with','for','at','n']);
  if(s===s.toLowerCase()||s===s.toUpperCase())return s.toLowerCase().split(' ').map((w,i)=>i>0&&SMALL.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function sentenceCase(s){s=s.trim().replace(/\s+/g,' ').replace(/[.!]+$/,'');if(s===s.toUpperCase())s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- host side ---------- */
function newG(){return{v:0,stage:'lobby',names:[PREF.name||'Player 1',''],cfg:Object.assign(JSON.parse(JSON.stringify(DEFCFG)),LS.get('ccp_cfg')||{}),
  adult:[0,0],online:0,plan:[],ri:0,scores:[0,0],rp:[],rdy:[0,0],vote:[0,0],q:null,aw:[],awn:0,ev:{n:0},game:0}}
function pool(name){const [c,x]=BANKS[name],h=G.cfg.heat;return h==='classic'?c:h==='spicy'?x:c.concat(x)}
function draw(name,n){
  const P=pool(name),used=USED[name];let c=P.filter(x=>!used.has(keyOf(x)));
  if(c.length<n){P.forEach(x=>used.delete(keyOf(x)));c=P.slice()}
  const pick=shuffle(c).slice(0,n);pick.forEach(x=>used.add(keyOf(x)));saveUsed();return pick;
}
function pickNew(name,cur){
  const P=pool(name),used=USED[name],inPlay=new Set(G.q.qs.map(q=>keyOf(q.p)));inPlay.add(keyOf(cur));
  let c=P.filter(x=>!used.has(keyOf(x))&&!inPlay.has(keyOf(x)));
  if(!c.length){P.forEach(x=>used.delete(keyOf(x)));inPlay.forEach(k=>used.add(k));c=P.filter(x=>!inPlay.has(keyOf(x)))}
  if(!c.length)return cur;const x=c[Math.random()*c.length|0];used.add(keyOf(x));saveUsed();return x;
}
function queue(items){const f=Math.random()<.5?0:1;return items.map((p,j)=>({p,s:(f+j)%2}))}
const cur=()=>G.q&&G.q.qs[G.q.i];
const rid=()=>G.plan[G.ri];

function award(p,pts,o={}){G.awn++;G.aw.push(Object.assign({id:G.game+'_'+G.awn,p,pts},o));G.scores[p]+=pts;if(G.rp[G.ri])G.rp[G.ri][p]+=pts}
function ev(type,data={}){G.ev=Object.assign({n:G.ev.n+1,type},data)}
function commit(){G.v++;LS.set('ccp_host',{code:CODE,G});send({t:'state',G});renderAll()}
function act(a){if(ROLE==='host'){handle(0,a);commit()}else send({t:'act',a})}

function handle(p,a){
  const it=cur();
  switch(a.t){
    case 'name':G.names[p]=String(a.v||'').slice(0,16)||('Player '+(p+1));return;
    case 'adult':G.adult[p]=a.v?1:0;return;
    case 'cfg':if(p===0&&G.stage==='lobby'){G.cfg=a.cfg;LS.set('ccp_cfg',G.cfg);if(G.cfg.heat==='classic')G.adult=[0,0]}return;
    case 'start':if(p!==0)return;startGame();return;
    case 'lobby':if(p!==0)return;G.stage='lobby';G.q=null;G.rdy=[0,0];G.adult=[0,0];return;
    case 'ready':G.rdy[p]=1;if(G.rdy[0]&&G.rdy[1])advance();return;
    case 'reroll':{
      if(!it||!rerollable(it))return;G.vote[p]=G.vote[p]?0:1;
      if(G.vote[0]&&G.vote[1]){const bank=rid()==='sp'?it.type:rid();it.p=pickNew(bank,it.p);it.rr=(it.rr||0)+1;ROUNDS[rid()].init(it);G.vote=[0,0];ev('reroll')}
      return}
    default:if(G.stage==='play'&&it)ROUNDS[rid()].act(p,a,it);
  }
}
function startGame(){
  G.game++;G.plan=RDEF.filter(r=>G.cfg.on[r.id]).map(r=>r.id);if(!G.plan.length)G.plan=['km'];
  G.ri=0;G.scores=[0,0];G.rp=G.plan.map(()=>[0,0]);G.aw=[];G.stage='intro';G.rdy=[0,0];G.vote=[0,0];G.q=null;ev('curtain');
}
function advance(){
  G.rdy=[0,0];G.vote=[0,0];
  if(G.stage==='intro'){G.stage='play';G.aw=[];ROUNDS[rid()].start();ROUNDS[rid()].init(cur());return}
  if(G.stage==='play'){
    G.aw=[];
    if(G.q.i<G.q.qs.length-1){G.q.i++;ROUNDS[rid()].init(cur());return}
    if(G.ri<G.plan.length-1){G.ri++;G.stage='intro';G.q=null;ev('curtain');return}
    G.stage='results';G.q=null;ev('curtain');return;
  }
  if(G.stage==='results'){startGame();return}
}
function rerollable(it){const r=rid();
  if(['rev','done'].includes(it.ph))return false;
  if(r==='dr'&&it.picks&&it.picks.length)return false;
  if(r==='top'&&it.ph!=='list')return false;
  return true;
}

/* ---------- transport ---------- */
function send(m){
  if(LOCAL){bc&&bc.postMessage(Object.assign({from:ROLE},m));return}
  if(conn&&conn.open)try{conn.send(m)}catch(e){}
}
function onMsg(m){
  lastHeard=Date.now();setNet(true);
  if(ROLE==='host'){
    if(m.t==='hello'){if(m.name)G.names[1]=String(m.name).slice(0,16);G.online=1;commit()}
    else if(m.t==='act'){handle(1,m.a);commit()}
  }else{
    if(m.t==='state'){G=m.G;renderAll()}
  }
}
function hostStart(code,resumeG){
  ROLE='host';ME=0;CODE=code;G=resumeG||newG();G.names[0]=PREF.name||G.names[0];
  if(LOCAL){bc=new BroadcastChannel('cc-'+code);bc.onmessage=e=>{if(e.data.from==='guest')onMsg(e.data)};setNet(false);commit();return}
  if(!window.Peer){fatal('Could not load the connection library. Check your internet and reload.');return}
  peer=new Peer(PREFIX+code,PEEROPTS);
  peer.on('open',()=>{commit()});
  peer.on('connection',c=>{
    if(conn&&conn!==c)try{conn.close()}catch(e){}
    conn=c;
    c.on('open',()=>{G.online=1;setNet(true);commit()});
    c.on('data',onMsg);
    c.on('close',()=>{if(conn===c){G.online=0;setNet(false);commit()}});
  });
  peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&!resumeG){try{peer.destroy()}catch(x){}hostStart(makeCode());return}
    if(e.type==='unavailable-id'){toast('That room is still open somewhere. Retrying...');setTimeout(()=>{try{peer.destroy()}catch(x){}hostStart(code,G)},3000);return}
    if(e.type!=='peer-unavailable')toast('Connection hiccup: '+e.type);
  });
  commit();
}
function guestStart(code){
  ROLE='guest';ME=1;CODE=code.toUpperCase();LS.set('ccp_guest',{code:CODE});
  renderWaitJoin('Connecting to room '+CODE);
  if(LOCAL){bc=new BroadcastChannel('cc-'+CODE);bc.onmessage=e=>{if(e.data.from==='host')onMsg(e.data)};send({t:'hello',name:PREF.name});return}
  if(!window.Peer){fatal('Could not load the connection library. Check your internet and reload.');return}
  peer=new Peer(PEEROPTS);
  peer.on('open',()=>dial());
  peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){renderWaitJoin(`Room ${CODE} isn't open yet. Retrying`);setTimeout(dial,2500);return}
    toast('Connection hiccup: '+e.type);
  });
}
function dial(){
  if(!peer||peer.destroyed)return;
  const c=peer.connect(PREFIX+CODE,{reliable:true});conn=c;
  c.on('open',()=>{setNet(true);c.send({t:'hello',name:PREF.name})});
  c.on('data',onMsg);
  c.on('close',()=>{if(conn===c){setNet(false);setTimeout(dial,2000)}});
}
// heartbeat both ways so a sleeping phone shows up as offline
setInterval(()=>{
  if(!ROLE)return;send({t:'ping'});
  if(ROLE==='host'&&G&&G.online&&Date.now()-lastHeard>12000&&!LOCAL){G.online=0;setNet(false);commit()}
  if(ROLE==='guest'&&!LOCAL&&lastHeard&&Date.now()-lastHeard>12000&&netOK){setNet(false);try{conn&&conn.close()}catch(e){}setTimeout(dial,500)}
},4000);
const _onMsg=onMsg;onMsg=function(m){if(m.t==='ping'){lastHeard=Date.now();if(ROLE==='host'&&G&&!G.online){G.online=1;commit()}setNet(true);return}_onMsg(m)};
function setNet(ok){netOK=ok;const p=$('#netpill');if(!p)return;p.classList.toggle('on',ok);
  p.querySelector('b').textContent=ROLE?(ok?(CODE?'Room '+CODE:'Connected'):(ROLE==='host'?'Room '+CODE+' · partner offline':'Reconnecting')):'Offline';
  $('#offline').classList.toggle('on',ROLE==='guest'&&!ok&&!!G&&!LOCAL);
}
function makeCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=A[Math.random()*A.length|0];return s}
function fatal(m){stage.innerHTML=`<div class="card center"><div class="waitbox"><div class="spin">📡</div><div class="msg">Can't connect</div><div class="sub">${esc(m)}</div></div></div>`}

let AC=null,NOISE=null;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}
  if(AC.state==='suspended')AC.resume();return AC}
addEventListener('pointerdown',()=>{try{ac()}catch(e){}},{once:true});
function tone(f,d,type='sine',v=.2,w=0,to=null){
  if(!PREF.sound||!AC)return;const c=AC,t=c.currentTime+w,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,v=.2,w=0,ftype='bandpass',freq=1000,q=1){
  if(!PREF.sound||!AC)return;const c=AC,t=c.currentTime+w,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=NOISE;f.type=ftype;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(c.destination);s.start(t,Math.random());s.stop(t+d+.05);
}

function sizeFx(){const dpr=Math.min(2,devicePixelRatio||1);[fx,bu].forEach(c=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr});fxc.setTransform(dpr,0,0,dpr,0,0);buc.setTransform(dpr,0,0,dpr,0,0)}
function seedAmb(){amb=Array.from({length:Math.min(70,innerWidth/10|0)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.6+Math.random()*2.4,s:.15+Math.random()*.5,tw:Math.random()*6.28,big:Math.random()<.12}))}
function ambLoop(t){
  fxc.clearRect(0,0,innerWidth,innerHeight);const sp=document.body.classList.contains('spicy');
  for(const p of amb){p.y-=p.s*(sp?1.6:1);p.x+=Math.sin(t/2000+p.tw)*.2;p.tw+=.03;if(p.y<-20){p.y=innerHeight+20;p.x=Math.random()*innerWidth}
    const a=.25+Math.sin(p.tw)*.25;
    if(p.big){const g=fxc.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*9);g.addColorStop(0,sp?`rgba(255,80,120,${a*.5})`:`rgba(255,210,120,${a*.35})`);g.addColorStop(1,'rgba(0,0,0,0)');fxc.fillStyle=g;fxc.beginPath();fxc.arc(p.x,p.y,p.r*9,0,7);fxc.fill()}
    else{fxc.fillStyle=sp?`rgba(255,140,90,${a+.2})`:`rgba(255,255,255,${a+.15})`;fxc.beginPath();fxc.arc(p.x,p.y,p.r,0,7);fxc.fill()}}
  if(!REDUCE)requestAnimationFrame(ambLoop);
}
function burstLoop(){
  buc.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.dr;p.r+=p.vr;p.life--;
    buc.save();buc.globalAlpha=Math.min(1,p.life/30);buc.translate(p.x,p.y);buc.rotate(p.r);
    if(p.e){buc.font=`${p.w*2}px serif`;buc.fillText(p.e,-p.w,p.w)}else if(p.spark){buc.fillStyle=p.c;buc.beginPath();buc.arc(0,0,p.w/2,0,7);buc.fill()}
    else{buc.fillStyle=p.c;buc.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)))}buc.restore()}
  if(parts.length)requestAnimationFrame(burstLoop);else{burstOn=false;buc.clearRect(0,0,innerWidth,innerHeight)}
}

function sparkleAt(el,n,cols){if(!el)return;const r=el.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,n,cols)}
function flash(){const f=$('#flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function hype(text,bad){const h=$('#hype');h.innerHTML=`<span class="${bad?'bad':''}">${esc(text)}</span>`;void h.offsetWidth;h.firstChild.classList.add('on')}
function shakeScreen(){const w=$('.wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
function curtainFx(){const c=$('#curtain');SFX.curtain();c.classList.add('closed');setTimeout(()=>{c.classList.remove('closed');SFX.curtain()},900)}
function bigWin(text){flash();hype(text);SFX.applause();confetti(140);buzz([30,40,60])}
function bigX(n){const x=$('#bigx');x.innerHTML='<span>'+'✕'.repeat(n)+'</span>';x.classList.remove('on');void x.offsetWidth;x.classList.add('on');SFX.strike();shakeScreen();buzz(200)}

/* =====================================================================
   RENDER LOOP
   ===================================================================== */
let curKey=null,curView=null,T0=0,lastEvN=null,lastGame=null,lastStage=null;
const fired=new Set(),sched=new Set(),onceSet=new Set();
// true the first time a screen is built, and stays true while that same screen is still up
function once(k){if(!onceSet.has(k)){onceSet.add(k);return true}return curKey===k}
function renderAll(){
  if(!G)return;
  document.body.classList.toggle('spicy',G.cfg.heat!=='classic');
  if(lastGame!==G.game){lastGame=G.game;fired.clear();sched.clear();G.aw.forEach(a=>{if(G.stage!=='play')fired.add(a.id)})}
  const v=buildView();
  if(v.key!==curKey){curKey=v.key;curView=v;T0=performance.now();stage.innerHTML=v.html;if(v.mount)v.mount();if(v.scroll!==false)window.scrollTo({top:0,behavior:'smooth'})}
  else{curView=v;if(v.patch)v.patch()}
  paintVote(v);paintReady(v);playEvents();runAwards();paintBoard();setNet(netOK||LOCAL&&G.online);
  if(lastStage!==G.stage){if(G.stage==='lobby'&&lastStage)curtainFx();lastStage=G.stage}
}
function playEvents(){
  if(lastEvN===null){lastEvN=G.ev.n;return}
  if(G.ev.n===lastEvN)return;lastEvN=G.ev.n;const e=G.ev;
  if(e.type==='curtain')curtainFx();
  if(e.type==='reroll'){SFX.reroll();toast('🎲 Rerolled!');buzz(60)}
  if(e.type==='hit'){SFX.ding();sparkleAt($('#t'+e.k),30)}
  if(e.type==='strike')bigX(e.n);
  if(e.type==='dup'){SFX.wrong()}
  if(e.type==='judge'){SFX.nudge();buzz([40,60,40])}
  if(e.type==='pick'){SFX.pop();sparkleAt($(`.dcard[data-v="${CSS.escape(e.v)}"]`),22,[e.p?'#2fd6ff':'#ff3d7f','#fff']);if(e.p!==ME)buzz(50)}
  if(e.type==='lock'&&e.p!==ME){SFX.lock()}
  if(e.type==='vote'&&e.p!==ME){SFX.nudge();buzz([30,50,30])}
}
// scores animate in as each reveal moment happens
function runAwards(){
  for(const a of G.aw){
    if(fired.has(a.id)||sched.has(a.id))continue;sched.add(a.id);
    const delay=a.d!=null?a.d:Math.max(0,a.at-(performance.now()-T0));
    setTimeout(()=>{fired.add(a.id);fireAward(a);paintBoard()},delay);
  }
}
const streak=[0,0];
function fireAward(a){
  if(a.miss){streak[a.p]=0;if(a.p===ME&&a.aww)SFX.aww()}
  if(a.big){bigWin(a.big);speak(a.big)}
  if(a.bad){hype(a.bad,1);SFX.aww();shakeScreen();speak(a.bad)}
  if(!a.pts)return;
  if(a.pts>0&&!a.quiet){streak[a.p]++;if(streak[a.p]===3)setTimeout(()=>{hype('🔥 On fire!');SFX.cymbal()},500)}
  const pod=$('#pod'+a.p);pod.classList.remove('bump');void pod.offsetWidth;pod.classList.add('bump');
  const fl=document.createElement('div');fl.className='float';fl.textContent=(a.pts>0?'+':'')+a.pts;fl.style.color=a.pts>0?'var(--ok)':'var(--bad)';pod.appendChild(fl);setTimeout(()=>fl.remove(),1400);
  if(a.pts>0&&!a.quiet)sparkleAt(pod,24,[a.p?'#2fd6ff':'#ff3d7f','#ffd23f','#fff']);
  if(a.p===ME&&a.pts>0)buzz(25);
}
function shownScore(i){let s=G.scores[i];for(const a of G.aw)if(a.p===i&&!fired.has(a.id))s-=a.pts;return s}
function paintBoard(){
  const on=['intro','play','results'].includes(G.stage);$('#board').style.display=on?'grid':'none';if(!on)return;
  const sc=[shownScore(0),shownScore(1)];
  [0,1].forEach(k=>{const p=$('#pod'+k);p.querySelector('.pname').textContent=G.names[k]||('Player '+(k+1));
    const el=p.querySelector('.score');if(+el.textContent!==sc[k])countTo(el,+el.textContent||0,sc[k]);
    p.querySelector('.you').textContent=k===ME?'YOU':'';
    p.classList.toggle('leader',sc[0]!==sc[1]&&(k===0?sc[0]>sc[1]:sc[1]>sc[0])&&Math.max(...sc)>0);
    p.classList.toggle('hot',streak[k]>=3);p.querySelector('.streak').textContent=`🔥 x${streak[k]}`;
    const st=curView&&curView.status?curView.status[k]:'';const s=p.querySelector('.st');s.textContent=st||'';s.className='st '+(st&&st.startsWith('✓')?'ok':'wait');
    p.classList.toggle('active',!!(curView&&curView.turn===k));
  });
  const rt=$('#roundtag');
  rt.innerHTML=G.stage==='results'?'Final<br>Scores':G.plan.length?`Round ${G.ri+1}<br>${esc(RDEF.find(r=>r.id===rid()).name)}`:'';
}
function countTo(el,a,b){const t0=performance.now();const f=n=>{const k=Math.min(1,(n-t0)/650);el.textContent=Math.round(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

/* ---------- shared view pieces ---------- */
function pips(i,n){return `<div class="pips">${Array.from({length:n},(_,k)=>`<i class="${k<i?'done':k===i?'cur':''}"></i>`).join('')}</div>`}
function meta(chip,cls=''){const n=G.q.qs.length;return `<div class="meta">${pips(G.q.i,n)}${chip?`<span class="chip-pts ${cls}">${chip}</span>`:''}</div>`}
const REROLL=`<button class="reroll" id="reroll"><span class="die">🎲</span><span class="rl">Reroll</span></button>`;
function card(html,reroll){return `<div class="card${reroll?' rr-pad':''}">${reroll?REROLL:''}${html}</div>`}
function waitBox(emoji,msg,sub=''){return `<div class="waitbox"><div class="spin">${emoji}</div><div class="msg dots">${msg}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`}
function paintVote(v){
  const it=G.stage==='play'&&cur(),can=it&&rerollable(it);
  const b=$('#reroll'),bar=$('#votebar');
  if(b){b.style.display=can?'':'none';const mine=G.vote[ME],theirs=G.vote[OTHER()];
    b.classList.toggle('voted',!!mine);b.classList.toggle('asked',!mine&&!!theirs);
    b.querySelector('.rl').textContent=mine?'Voted (1/2)':theirs?'Agree to reroll':'Reroll';
    b.onclick=()=>{act({t:'reroll'});SFX.tick()}}
  const show=can&&G.vote[OTHER()]&&!G.vote[ME];
  bar.classList.toggle('on',!!show);
  if(show){bar.innerHTML=`<span>🎲 ${N(OTHER())} wants a new question</span><button class="btn" id="vagree">Reroll it</button>`;$('#vagree').onclick=()=>act({t:'reroll'})}
}
function paintReady(v){
  const c=$('#ctl');if(!c)return;
  if(!v.ready){c.innerHTML='';return}
  const show=()=>{const c=$('#ctl');if(!c||curView!==v&&curView.key!==v.key)return;
    const mine=G.rdy[ME],theirs=G.rdy[OTHER()];
    const lbl=mine?`Waiting for ${N(OTHER())}`:`${v.ready}${theirs?' (1/2)':''} ▸`;
    const h=`<div class="readyrow"><button class="btn ${mine?'waiting':''}" id="next" ${mine?'disabled':''}>${lbl}</button></div>`;
    if(c.dataset.h!==h){c.innerHTML=h;c.dataset.h=h;const n=$('#next');if(n&&!mine)n.onclick=()=>{act({t:'ready'});SFX.tick()}}};
  const wait=(v.readyAt||0)-(performance.now()-T0);
  if(wait>0){c.innerHTML='';c.dataset.h='';setTimeout(()=>{if(curKey===v.key)show()},wait)}else show();
}

function buildView(){

    <h2 class="sec">Your name</h2>
    <div class="inrow" style="max-width:420px"><input id="me" type="text" maxlength="16" placeholder="Your name" value="${esc(PREF.name)}" style="text-align:center"></div>
    ${room?`<h2 class="sec">You've been invited</h2><div class="roomcode">${esc(room)}</div><div class="big2"><button class="btn huge" id="joinlink">Join the game</button></div>`
    :`<div class="big2"><button class="btn huge" id="host">🎬 Host a game</button></div>
      <h2 class="sec">Or join one</h2>
      <div class="codebox"><input id="code" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" value="${gsaved&&gsaved.code?esc(gsaved.code):''}"><button class="btn" id="join">Join</button></div>`}
    ${canResume?`<div class="resume"><b>Game in progress in room ${esc(saved.code)}</b><div class="row" style="margin-top:8px"><button class="btn small" id="resume">Resume hosting</button><button class="btn ghost small" id="discard">Discard</button></div></div>`:''}
    <div class="hint">One phone hosts, the other joins with the code. Both phones need to be online.</div></div>`;
  const nm=()=>{const v=$('#me').value.trim();if(!v){shakeEl($('#me'));$('#me').focus();return null}PREF.name=v.slice(0,16);savePref();return v};
  if(room){$('#joinlink').onclick=()=>{if(nm())guestStart(room)}}

  top:{desc:()=>`One of you lists your top ${G.cfg.topN}. The other uncovers the board by guessing. The list owner rules on close calls from their own phone. Three strikes ends the turn.`,chips:()=>[`#1 is worth ${TOP_PTS[G.cfg.topN][0]}`,'Clear the board +100','❌❌❌ = out']},
  p3:{desc:()=>`Pick your top 3 from the list or write in your own. Your partner has to find all three hiding in a lineup.`,chips:['🥇 +150','🥈 +100','🥉 +75','Exact spot +50']},
  rk:{desc:()=>`Same list on both phones. The subject drags their real order while the other drags their guess, at the same time.`,chips:['Exact spot +60','One off +20','Perfect +100 bonus']},

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/\bn\b/g,'and').replace(/[^a-z0-9 ]+/g,' ').replace(/\b(the|a|an|my)\b/g,' ').split(/\s+/).filter(Boolean)
